
<!--
  FILE: results.html  — DEPRECATED / PLACEHOLDER
  =================================================
  This Thymeleaf server-rendered results page is no longer part of the active system.

  WHAT REPLACED IT:
  The Angular SPA renders all trend data dynamically through REST API calls to
  CrawlController. The results view in Angular consists of:
  - A radar dashboard component showing tech cards grouped by category
  - A leaderboard component consuming GET /api/trends/rising and /api/trends/declining
  - A snapshot timeline component consuming GET /api/snapshot/{id}
  - A detail view for a single tech's history via GET /api/trends/{canonicalName}

  WHY THIS FILE STILL EXISTS:
  Spring Boot's Thymeleaf auto-configuration scans the templates/ directory.
  Having no templates at all is fine, but keeping this file here as a placeholder
  prevents any accidental 404 if a stale reference to /results exists somewhere.

  If the Angular app is ever built and placed into src/main/resources/static/,
  both this file and index.html can be replaced with the Angular build output.

  CONNECTS TO:
  - UIController previously mapped GET /results here — that mapping is now removed.
  - CrawlController REST endpoints are the live data surface consumed by Angular.
