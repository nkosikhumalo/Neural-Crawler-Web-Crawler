# Dev profile overrides
# Use a fixed port — run kill-port.sh first if getting "port in use" errors
server.port=8080

# Disable scheduled crawls during development so they don't fire automatically
radar.schedule.enabled=false

# Shorter timeouts for faster dev feedback
crawler.http.connect-timeout=5000
crawler.http.read-timeout=10000
crawler.rate.min-delay-ms=500
crawler.rate.max-delay-ms=1500
