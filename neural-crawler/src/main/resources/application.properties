
#
# FILE: application.properties
# ==============================
# Central configuration file for the Neural Crawler application.
# All runtime settings live here — no hardcoded values in Java source files.
#

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================
# SPRING APPLICATION CONFIGURATION
# ============================================
spring.application.name=neural-crawler
spring.profiles.active=dev

# ============================================
# CORS CONFIGURATION (for Angular frontend)
# ============================================
radar.cors.allowed-origins=http://localhost:4200,http://localhost:3000
radar.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
radar.cors.allowed-headers=*
radar.cors.allow-credentials=true
radar.cors.max-age=3600

# ============================================
# SCHEDULER CONFIGURATION
# ============================================
radar.schedule.enabled=true
radar.schedule.cron=0 0 */6 * * *
radar.schedule.initial-delay=60000

# ============================================
# CRAWL SOURCE CONFIGURATION
# ============================================
# GitHub Trending URLs
radar.sources.github.urls=https://github.com/trending,https://github.com/trending/developers
radar.sources.github.api-url=https://api.github.com

# Hacker News
radar.sources.hackernews.url=https://news.ycombinator.com
radar.sources.hackernews.api-url=https://hacker-news.firebaseio.com/v0

# Maven Central
radar.sources.maven.api-url=https://search.maven.org/solrsearch/select
radar.sources.maven.default-rows=50

# Additional web crawling sources
radar.sources.web.default-max-depth=3
radar.sources.web.default-max-pages=100
radar.sources.web.default-follow-redirects=true

# ============================================
# HTTP CLIENT CONFIGURATION
# ============================================
crawler.user-agent=NeuralCrawler/1.0 (+https://github.com/nkosikhumalo/Neural-Crawler-Web-Crawler)
crawler.http.connect-timeout=10000
crawler.http.read-timeout=30000
crawler.http.socket-timeout=30000
crawler.http.connection-request-timeout=5000
crawler.thread-pool.size=10
crawler.thread-pool.max-size=20
crawler.thread-pool.queue-capacity=100

# ============================================
# RATE LIMITING CONFIGURATION
# ============================================
crawler.rate.min-delay-ms=1000
crawler.rate.max-delay-ms=3000
crawler.rate.requests-per-second=2
crawler.rate.concurrent-requests-per-domain=3

# ============================================
# ROBOTS.TXT CONFIGURATION
# ============================================
crawler.robots.enabled=true
crawler.robots.cache-timeout=3600000
crawler.robots.user-agent=*

# ============================================
# NORMALIZATION CONFIGURATION
# ============================================
radar.normalization.map-file=classpath:tech-aliases.json
radar.normalization.case-sensitive=false
radar.normalization.strip-whitespace=true
radar.normalization.remove-special-chars=true

# ============================================
# TREND ANALYSIS CONFIGURATION
# ============================================
radar.analysis.momentum-threshold=15.0
radar.analysis.decay-factor=0.95
radar.analysis.min-occurrences=3
radar.analysis.window-size=7

# ============================================
# DATABASE CONFIGURATION
# ============================================
# H2 in-memory database (default for development)
spring.datasource.url=jdbc:h2:mem:neuralcrawler
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# DATA EXPORT CONFIGURATION
# ============================================
export.csv.delimiter=,
export.csv.include-headers=true
export.json.pretty-print=true
export.default-format=json

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.neuralcrawler=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Console logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/neural-crawler.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# PLAYWRIGHT CONFIGURATION (if using Playwright)
# ============================================
playwright.headless=true
playwright.timeout=30000
playwright.viewport-width=1920
playwright.viewport-height=1080

# ============================================
# CACHE CONFIGURATION
# ============================================
spring.cache.type=simple
spring.cache.cache-names=crawlResults,trendData,snapshots
spring.cache.time-to-live=3600000

# ============================================
# ACTUATOR CONFIGURATION (for monitoring)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.health.defaults.enabled=true

# ============================================
# SECURITY CONFIGURATION
# ============================================
security.basic.enabled=false
security.headers.frame=false

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# ASYNC CONFIGURATION
# ============================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=crawler-

# ============================================
# TEMPLATES CONFIGURATION (Thymeleaf)
# ============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
