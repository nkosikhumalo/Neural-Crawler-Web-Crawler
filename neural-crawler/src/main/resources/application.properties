
#
# FILE: application.properties
# ==============================
# Spring Boot's central configuration file. All runtime settings for the application
# are defined or overridden here — no hardcoded values should exist in Java source files.
#
# WHAT IT CONFIGURES:
#
# Server:
#   - server.port: which port Tomcat listens on (default 8080)
#
# Crawler defaults (bound to CrawlerConfig / SelectorConfig via @ConfigurationProperties):
#   - crawler.default.max-depth: how many link levels deep to crawl (e.g., 2)
#   - crawler.default.max-pages: total page cap per crawl session (e.g., 100)
#   - crawler.default.delay-ms: politeness delay in milliseconds between requests (e.g., 1000)
#   - crawler.thread-pool.size: number of concurrent crawler threads (e.g., 4)
#   - crawler.user-agent: User-Agent header string sent with every request
#
# Default CSS selectors for books.toscrape.com:
#   - crawler.selectors.title: CSS selector for book title
#   - crawler.selectors.price: CSS selector for price
#   - crawler.selectors.availability: CSS selector for stock status
#   - crawler.selectors.next-page: CSS selector for pagination next link
#
# Database (optional, for JPA mode):
#   - spring.datasource.url / username / password
#   - spring.jpa.hibernate.ddl-auto
#
# WHY IT EXISTS:
# Externalizing config means you can change crawl depth, delay, or thread count
# without touching or recompiling any Java. It also supports environment-specific
# overrides (dev vs. production profiles).
#
# CONNECTS TO:
# - CrawlerConfig reads thread pool and HTTP client settings from here.
# - SelectorConfig reads CSS selector strings from here.
# - Spring Boot auto-configures Thymeleaf, Jackson, and Tomcat based on entries here.
#
